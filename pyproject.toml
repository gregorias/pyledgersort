[project]
name = "pyledgersort"
version = "0.1.0"
description = "A tool for chronologically sorting a ledger."
requires-python = ">=3.13"
readme = "README.md"
license = { "text" = "AGPL-3.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
]
dependencies = ["parsy>=2.2"]

[project.urls]
Repository = "https://github.com/gregorias/pyledgersort"

[project.scripts]
ledgersort = "pyledgersort.cli:main"

[dependency-groups]
dev = [
  "black>=25.11.0",
  "mypy>=1.19.1",
  "ruff>=0.15.15",
  "validate-pyproject>=0.25",
  "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
